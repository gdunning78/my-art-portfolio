<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Sophia Bateman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap');
        h1 { font-family: 'Bodoni+Moda', serif; }
        body { font-family: 'Inter', sans-serif; background-color: #fdfdfd; }
    </style>
</head>
<body class="text-gray-900 flex flex-col min-h-screen">
    
    <nav class="p-8 flex justify-between items-center max-w-6xl mx-auto w-full">
        <a href="index.html" class="text-3xl tracking-widest uppercase hover:opacity-70 transition-opacity">
            <h1>Sophia Bateman</h1>
        </a>
        <a href="index.html" class="text-sm uppercase tracking-tighter text-gray-500 hover:text-black transition-colors">Back to Gallery</a>
    </nav>

    <main class="flex-grow">
        <section class="max-w-3xl mx-auto p-12 bg-white mt-10 shadow-sm border border-gray-50">
            <div class="text-center mb-10">
                <h2 class="text-4xl font-light uppercase tracking-widest mb-2">Contact</h2>
                <p class="text-gray-400 italic">For inquiries or commissions</p>
            </div>

            <form action="https://api.web3forms.com/submit" method="POST" class="space-y-6">
                <input type="hidden" name="access_key" value="7e12b851-fa1b-4873-b2b3-8cd5137ab12c">
                <input type="hidden" name="redirect" value="https://gdunning78.github.io/my-art-portfolio/success.html">
                
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Name</label>
                    <input type="text" name="name" required class="w-full border-b border-gray-300 p-2 focus:outline-none focus:border-black transition-colors bg-transparent">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Email</label>
                    <input type="email" name="email" required class="w-full border-b border-gray-300 p-2 focus:outline-none focus:border-black transition-colors bg-transparent">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Message</label>
                    <textarea name="message" rows="6" required class="w-full border-b border-gray-300 p-2 focus:outline-none focus:border-black transition-colors bg-transparent"></textarea>
                </div>
                <div class="text-center">
                    <button type="submit" class="mt-4 px-10 py-3 border border-black text-sm uppercase tracking-widest hover:bg-black hover:text-white transition-all">
                        Send Message
                    </button>
                </div>
            </form>
        </section>
    </main>

<footer class="py-24 px-8 bg-[#111] text-white">
    <div class="max-w-6xl mx-auto text-center space-y-6">
        <h2 class="text-4xl uppercase tracking-tighter mb-4">Sophia Bateman</h2>
        
        <div class="flex justify-center">
            <a href="https://instagram.com/bateman_art" target="_blank" class="text-gray-500 hover:text-white transition-colors">
                <i data-lucide="instagram" class="w-6 h-6"></i>
            </a>
        </div>

        <p class="text-[9px] text-gray-600 tracking-[0.5em] uppercase">&copy; 2026 Sophia Bateman.</p>
    </div>
</footer>

    <script>
      lucide.createIcons();
    </script>
</body>
</html>
