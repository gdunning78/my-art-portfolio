<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Sophia Bateman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap');
        
        /* Fixed Typography */
        h1, h2, h3 { font-family: 'Bodoni Moda', serif; }
        body { font-family: 'Inter', sans-serif; background-color: #fdfdfd; cursor: none; }

        /* Custom Cursor Styles */
        #cursor { 
            width: 8px; height: 8px; background: black; border-radius: 50%; 
            position: fixed; pointer-events: none; z-index: 9999; 
            transition: transform 0.1s ease, background 0.3s ease; 
            transform: translate(-50%, -50%); 
        }
        .cursor-hover #cursor { 
            transform: translate(-50%, -50%) scale(5); 
            background: rgba(0,0,0,0.05); border: 0.5px solid rgba(0,0,0,0.2); 
        }
    </style>
</head>
<body class="text-gray-900 flex flex-col min-h-screen relative">

    <div id="cursor" class="hidden md:block"></div>
    
    <nav class="p-8 flex justify-between items-center max-w-6xl mx-auto w-full">
        <a href="index.html" class="text-3xl tracking-widest uppercase hover:opacity-70 transition-opacity">
            <h1>Sophia Bateman</h1>
        </a>
        <a href="index.html" class="text-sm uppercase tracking-tighter text-gray-500 hover:text-black transition-colors">Back to Gallery</a>
    </nav>

    <main class="flex-grow">
        <section class="max-w-3xl mx-auto p-12 bg-white mt-10 shadow-sm border border-gray-50">
            <div class="text-center mb-10">
                <h2 class="text-4xl font-light uppercase tracking-widest mb-2">Contact</h2>
                <p class="text-gray-400 italic">For inquiries or commissions</p>
            </div>

            <!-- Removed action and method attributes to fully control via JavaScript -->
            <form id="contactForm" class="space-y-6">
                <input type="hidden" name="access_key" value="7e12b851-fa1b-4873-b2b3-8cd5137ab12c">
                
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Name</label>
                    <input type="text" name="name" required class="w-full border-b border-gray-300 p-2 focus:outline-none focus:border-black transition-colors bg-transparent">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Email</label>
                    <input type="email" name="email" required class="w-full border-b border-gray-300 p-2 focus:outline-none focus:border-black transition-colors bg-transparent">
                </div>
                <div>
                    <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Message</label>
                    <textarea name="message" rows="6" required class="w-full border-b border-gray-300 p-2 focus:outline-none focus:border-black transition-colors bg-transparent"></textarea>
                </div>
                <div class="text-center">
                    <button type="submit" class="mt-4 px-10 py-3 border border-black text-sm uppercase tracking-widest hover:bg-black hover:text-white transition-all">
                        Send Message
                    </button>
                </div>
            </form>
        </section>
    </main>

    <footer class="py-24 px-8 bg-[#111] text-white">
        <div class="max-w-6xl mx-auto text-center space-y-6">
            <h2 class="text-4xl uppercase tracking-tighter mb-4">Sophia Bateman</h2>
            
            <div class="flex justify-center">
                <a href="https://instagram.com/bateman_art" target="_blank" class="hover:text-gray-400 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6">
                        <rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>
                    </svg>
                </a>
            </div>

            <p class="text-[9px] text-gray-600 tracking-[0.5em] uppercase">&copy; 2026 Sophia Bateman.</p>
        </div>
    </footer>

   <script>
        // Init Lucide Layout Icons
        lucide.createIcons();

        // Custom Cursor Logic
        const cursor = document.getElementById('cursor');
        document.addEventListener('mousemove', e => {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
        });

        // Add hover effect to interactive elements
        document.querySelectorAll('a, button, input, textarea').forEach(el => {
            el.onmouseenter = () => document.body.classList.add('cursor-hover');
            el.onmouseleave = () => document.body.classList.remove('cursor-hover');
        });

        // Background Submission and Guaranteed Redirection Script
        const form = document.getElementById('contactForm');

        form.addEventListener('submit', function(e) {
            e.preventDefault(); // Stop standard browser submission page navigation
            
            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: json
            })
            .then(async (response) => {
                if (response.status == 200) {
                    // Force deployment landing directly to your custom thank you screen
                    window.location.href = "success.html";
                } else {
                    console.log(response);
                    alert("Something went wrong. Please try again.");
                }
            })
            .catch(error => {
                console.log(error);
                alert("Submission failed. Check your internet connection.");
            });
        });
    </script>
</body>
</html>
