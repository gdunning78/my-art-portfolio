<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Portfolio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap');
        h1 { font-family: 'Bodoni+Moda', serif; }
        body { font-family: 'Inter', sans-serif; background-color: #fdfdfd; }
    </style>
</head>
<body class="text-gray-900">

    <nav class="p-8 flex justify-between items-center max-w-6xl mx-auto">
        <h1 class="text-3xl tracking-widest uppercase">Sophia Bateman</h1>
        <div class="space-x-6 text-sm uppercase tracking-tighter text-gray-500">
            <a href="#contact" class="hover:text-black">Contact</a>
        </div>
    </nav>

    <header class="text-center py-20 border-b border-gray-100">
        <p class="italic text-gray-400 mb-2">Acrylic & Watercolor</p>
        <h2 class="text-5xl font-light mb-4">Modern Art</h2>
    </header>

    <main class="max-w-6xl mx-auto p-6 lg:p-12">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">
            
            <div class="group cursor-pointer">
                <div class="overflow-hidden bg-gray-100">
                    <img src="Darwin.jpg" class="w-full h-auto block">
                </div>
                <h3 class="mt-4 text-lg font-light italic">Darwin</h3> 
                <p class="text-xs text-gray-400 uppercase tracking-widest">Mixed Media Acrylic</p>
            </div>

            <div class="group cursor-pointer">
                <div class="overflow-hidden bg-gray-100 aspect-[4/5]">
                    <img src="Marbles.jpg" class="w-full h-auto block">
                </div>
                <h3 class="mt-4 text-lg font-light italic">Marbles</h3>
                <p class="text-xs text-gray-400 uppercase tracking-widest">Mixed Media Acrylic</p>
            </div>
 
            <div class="group cursor-pointer">
                <div class="overflow-hidden bg-gray-100">
                    <img src="Water.jpg" class="w-full h-auto block">
                </div>
                <h3 class="mt-4 text-lg font-light italic">Water</h3> 
                <p class="text-xs text-gray-400 uppercase tracking-widest">Mixed Media Acrylic</p>
            </div>
            
        </div>
    </main>
<section id="contact" class="max-w-3xl mx-auto p-12 bg-white mt-20 shadow-sm border border-gray-50">
    <div class="text-center mb-10">
        <h2 class="text-3xl font-light uppercase tracking-widest mb-2">Get in Touch</h2>
        <p class="text-gray-400 italic">For inquiries or commissions</p>
    </div>

    <form action="https://api.web3forms.com/submit" method="POST" class="space-y-6">
        <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY">
        
        <div>
            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Name</label>
            <input type="text" name="name" required class="w-full border-b border-gray-300 p-2 focus:outline-none focus:border-black transition-colors bg-transparent">
        </div>

        <div>
            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Email</label>
            <input type="email" name="email" required class="w-full border-b border-gray-300 p-2 focus:outline-none focus:border-black transition-colors bg-transparent">
        </div>

        <div>
            <label class="block text-xs uppercase tracking-widest text-gray-500 mb-2">Message</label>
            <textarea name="message" rows="4" required class="w-full border-b border-gray-300 p-2 focus:outline-none focus:border-black transition-colors bg-transparent"></textarea>
        </div>

        <div class="text-center">
            <button type="submit" class="mt-4 px-10 py-3 border border-black text-sm uppercase tracking-widest hover:bg-black hover:text-white transition-all">
                Send Message
            </button>
        </div>
    </form>
</section>
    <footer class="py-20 text-center text-gray-400 text-sm border-t border-gray-100">
        <p>&copy; 2026 Artist Name. All Rights Reserved.</p>
    </footer>

</body>
</html>
