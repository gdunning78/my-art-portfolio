<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Portfolio | Sophia Bateman</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;1,400&family=Inter:wght@300;400&display=swap');
        h1, h2, h3 { font-family: 'Bodoni+Moda', serif; }
        body { font-family: 'Inter', sans-serif; background-color: #fdfdfd; scroll-behavior: smooth; overflow-x: hidden; }
        
        .dropdown:hover .dropdown-menu { display: block; }
        #backToTop.hidden-btn { opacity: 0; pointer-events: none; }
        #backToTop.visible-btn { opacity: 1; pointer-events: auto; }

        #mobileMenu { transition: transform 0.3s ease-in-out; }
        .menu-open { transform: translateX(0); }
        .menu-closed { transform: translateX(100%); }
    </style>
</head>
<body class="text-gray-900 relative">

    <nav id="top" class="p-6 md:p-8 flex justify-between items-center max-w-6xl mx-auto relative z-40">
        <h1 class="text-2xl md:text-3xl tracking-widest uppercase">Sophia Bateman</h1>
        
        <div class="hidden md:flex space-x-8 text-sm uppercase tracking-tighter text-gray-500 items-center">
            <div class="relative dropdown py-2">
                <button class="flex items-center hover:text-black transition-colors uppercase outline-none">
                    Collections <i data-lucide="chevron-down" class="w-4 h-4 ml-1"></i>
                </button>
                <div class="dropdown-menu absolute hidden bg-white shadow-xl border border-gray-100 py-4 px-6 z-50 w-48 left-0 top-full">
                    <ul class="space-y-3">
                        <li><a href="#botanicals" class="hover:text-black block transition-colors">Botanicals</a></li>
                        <li><a href="#pop-culture" class="hover:text-black block transition-colors">Pop Culture</a></li>
                        <li><a href="#lifestyle" class="hover:text-black block transition-colors">Lifestyle</a></li>
                        <li><a href="#abstracts" class="hover:text-black block transition-colors">Abstracts</a></li>
                    </ul>
                </div>
            </div>
            <a href="about.html" class="hover:text-black transition-colors">About</a>
            <a href="contact.html" class="hover:text-black transition-colors">Contact</a>
        </div>

        <button id="menuBtn" class="md:hidden text-gray-500 hover:text-black transition-colors">
            <i data-lucide="menu" class="w-6 h-6"></i>
        </button>
    </nav>

    <div id="mobileMenu" class="fixed top-0 right-0 h-full w-64 bg-white shadow-2xl z-50 p-8 menu-closed md:hidden">
        <div class="flex justify-end mb-8">
            <button id="closeBtn" class="text-gray-500 hover:text-black">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>
        <ul class="flex flex-col space-y-6 text-sm uppercase tracking-widest text-gray-500">
            <li><a href="index.html" class="hover:text-black">Gallery</a></li>
            <li><a href="about.html" class="hover:text-black">About</a></li>
            <li><a href="contact.html" class="hover:text-black">Contact</a></li>
            <li class="pt-6 border-t border-gray-100 italic lowercase text-gray-400 text-xs">Collections</li>
            <li><a href="#botanicals" class="mobile-link text-xs hover:text-black">Botanicals</a></li>
            <li><a href="#pop-culture" class="mobile-link text-xs hover:text-black">Pop Culture</a></li>
            <li class="pt-6">
                <a href="https://www.instagram.com/bateman_art" target="_blank" class="flex items-center text-gray-400 hover:text-black transition-colors lowercase tracking-normal">
                    <i data-lucide="instagram" class="w-4 h-4 mr-2"></i> @bateman_art
                </a>
            </li>
        </ul>
    </div>

    <header class="text-center py-12 md:py-20 border-b border-gray-100">
        <p class="italic text-gray-400 mb-2 font-light">Acrylic & Watercolor</p>
        <h2 class="text-4xl md:text-5xl font-light mb-4 text-slate-800">Modern Art</h2>
    </header>

    <main class="max-w-6xl mx-auto p-6 lg:p-12">
        </main>

    <button id="backToTop" class="fixed bottom-6 right-6 z-40 bg-white border border-gray-200 p-3 rounded-full shadow-lg hover:bg-black hover:text-white transition-all duration-300 hidden-btn">
        <i data-lucide="chevron-up" class="w-5 h-5"></i>
    </button>

    <footer class="py-20 text-center border-t border-gray-100 mt-10">
        <div class="flex justify-center space-x-6 mb-8">
            <a href="https://www.instagram.com/bateman_art" target="_blank" class="text-gray-400 hover:text-black transition-colors flex items-center gap-2 uppercase text-[10px] tracking-widest">
                <i data-lucide="instagram" class="w-5 h-5"></i> Instagram
            </a>
        </div>
        <p class="text-gray-400 text-[10px] uppercase tracking-widest leading-loose">
            &copy; 2026 Sophia Bateman<br>All Rights Reserved.
        </p>
    </footer>

    <script>
        lucide.createIcons();

        // Mobile Menu Logic
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');
        const mobileMenu = document.getElementById('mobileMenu');
        const mobileLinks = document.querySelectorAll('.mobile-link');

        menuBtn.addEventListener('click', () => {
            mobileMenu.classList.remove('menu-closed');
            mobileMenu.classList.add('menu-open');
        });

        const closeMenu = () => {
            mobileMenu.classList.remove('menu-open');
            mobileMenu.classList.add('menu-closed');
        };

        closeBtn.addEventListener('click', closeMenu);
        mobileLinks.forEach(link => link.addEventListener('click', closeMenu));

        // Back to Top Logic
        const backToTopBtn = document.getElementById('backToTop');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 400) {
                backToTopBtn.classList.replace('hidden-btn', 'visible-btn');
            } else {
                backToTopBtn.classList.replace('visible-btn', 'hidden-btn');
            }
        });
        backToTopBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    </script>
</body>
</html>
